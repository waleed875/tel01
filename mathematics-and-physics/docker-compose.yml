services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineering_tutor}
      POSTGRES_USER: ${POSTGRES_USER:-tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [internal]

  gitea-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:?Set GITEA_DB_PASSWORD in .env}
    volumes:
      - gitea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [internal]

  gitea:
    image: docker.gitea.com/gitea:1.27.3
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?Set GITEA_DB_PASSWORD in .env}
      GITEA__server__ROOT_URL: http://localhost:3001/
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: "3000"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea_data:/data
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      gitea-db:
        condition: service_healthy
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tutor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-engineering_tutor}
      MODEL_CHECKPOINT: /app/models/checkpoint.pt
      COOKIE_SECURE: "false"
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_OWNER: ${GITEA_OWNER:-}
      GITEA_API_TOKEN: ${GITEA_API_TOKEN:-}
      RESEARCH_SERVICE_URL: http://ai-browser:8085
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - trained_models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, research]

  ai-browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    restart: unless-stopped
    environment:
      SEARXNG_URL: http://searxng:8080/search
    depends_on: [searxng]
    networks: [research]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 96
    mem_limit: 256m

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [research]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    security_opt:
      - no-new-privileges:true

  training-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "engine.worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tutor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-engineering_tutor}
      MODEL_ROOT: /app/models
    volumes:
      - trained_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  trainer:
    build: .
    profiles: ["train"]
    command: ["python", "-m", "engine.train", "--data", "/app/datasets/engineering.txt", "--output", "/app/models"]
    user: "0:0"
    volumes:
      - trained_models:/app/models
      - ./datasets:/app/datasets:ro
    networks: [internal]

  trainer-gpu:
    build: .
    profiles: ["gpu"]
    entrypoint: ["python", "-m", "engine.train"]
    command: ["--data", "/app/datasets/engineering.txt", "--output", "/app/models", "--device", "cuda"]
    gpus: all
    user: "0:0"
    network_mode: none
    volumes:
      - trained_models:/app/models
      - ./datasets:/app/datasets:ro

networks:
  internal:
    driver: bridge
    internal: true
  research:
    driver: bridge

volumes:
  postgres_data:
  gitea_postgres_data:
  gitea_data:
  trained_models:
