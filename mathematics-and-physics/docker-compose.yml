services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineering_tutor}
      POSTGRES_USER: ${POSTGRES_USER:-tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tutor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-engineering_tutor}
      MODEL_CHECKPOINT: /app/models/checkpoint.pt
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - trained_models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  trainer:
    build: .
    profiles: ["train"]
    command: ["python", "-m", "engine.train", "--data", "/app/datasets/engineering.txt", "--output", "/app/models"]
    user: "0:0"
    volumes:
      - trained_models:/app/models
      - ./datasets:/app/datasets:ro
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  trained_models:
