name: Engineering AI checks

on:
  pull_request:
    paths:
      - 'mathematics-and-physics/**'
      - '.github/workflows/engineering-ai-tests.yml'
  push:
    branches:
      - feature/from-scratch-engineering-ai
      - feature/local-gitea-workspace
    paths:
      - 'mathematics-and-physics/**'
      - '.github/workflows/engineering-ai-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: engineering_tutor_test
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: local_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d engineering_tutor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mathematics-and-physics
    env:
      TEST_DATABASE_URL: postgresql://tutor:local_test_password_only@localhost:5432/engineering_tutor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mathematics-and-physics/requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q webapp.py storage.py auth.py tutor.py engine knowledge.py questions.py tests
      - name: Unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration with placeholder CI secrets
        env:
          POSTGRES_PASSWORD: ci-local-db-password
          GITEA_DB_PASSWORD: ci-local-gitea-password
        run: |
          cp .env.example .env
          docker compose config --quiet

  gitea-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathematics-and-physics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated integration dependency
        run: pip install 'httpx>=0.27,<1'
      - name: Start disposable Gitea 1.27.3 (SQLite) on loopback
        run: |
          docker run -d --name gitea-ci \
            -p 127.0.0.1:3000:3000 \
            -e GITEA__database__DB_TYPE=sqlite3 \
            -e GITEA__security__INSTALL_LOCK=true \
            -e GITEA__repository__DEFAULT_BRANCH=main \
            -e GITEA__service__DISABLE_REGISTRATION=true \
            docker.gitea.com/gitea:1.27.3
          echo "127.0.0.1 gitea" | sudo tee -a /etc/hosts > /dev/null
      - name: Verify create, file commits, stale conflict, binary and delete against live Gitea
        run: python tests/bootstrap_gitea_ci.py
      - name: Remove ephemeral Gitea service
        if: always()
        run: docker rm -f gitea-ci || true

  backup-restore-rehearsal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathematics-and-physics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the complete backup restores into fresh disposable Docker resources
        run: PYTHONPATH=. python tests/backup_restore_live_smoke.py

  ai-browser-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathematics-and-physics
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated AI browser and SearXNG search
        run: |
          cp .env.example .env
          docker compose up -d --build ai-browser searxng
      - name: Check local JSON search and prohibited internal URL in isolated container
        run: |
          docker compose exec -T ai-browser python - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error

          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://searxng:8080/", timeout=3) as r:
                      assert r.status == 200
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("SearXNG did not start in allotted time")

          request = urllib.request.Request(
              "http://127.0.0.1:8085/read",
              data=json.dumps({"url":"https://127.0.0.1/admin"}).encode(),
              headers={"Content-Type":"application/json"},
              method="POST")
          try:
              urllib.request.urlopen(request, timeout=8)
          except urllib.error.HTTPError as exc:
              assert exc.code == 422, exc.code
          else:
              raise AssertionError("Research service permitted private IP")
          print("PASS: SearXNG alive, isolated reader rejects localhost")
          PY
      - name: Remove disposable research containers
        if: always()
        run: docker compose down --remove-orphans

  multi-language-sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathematics-and-physics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download operator-approved fixed-version runtimes for test use
        run: |
          docker pull python:3.12-alpine
          docker pull node:22-alpine
          docker pull gcc:14
      - name: Verify Docker-isolated Python, JavaScript, C, C++ and resource cutoffs
        run: PYTHONPATH=. python tests/multilanguage_live_smoke.py
      - name: Verify no disposable run containers remain
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^lab-code-'; then
            echo "ERROR: disposable code containers were not cleaned up"
            docker ps -a --format '{{.Names}}' | grep '^lab-code-'
            exit 1
          fi

  multi-language-extended:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mathematics-and-physics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull fixed-version Go Rust Java Ruby and PHP images
        run: |
          docker pull golang:1.24-alpine
          docker pull rust:1.86-alpine
          docker pull eclipse-temurin:21-jdk-alpine
          docker pull ruby:3.3-alpine
          docker pull php:8.3-cli-alpine
      - name: Execute remaining five languages inside local-only sandbox
        run: PYTHONPATH=. python tests/multilanguage_extended_smoke.py
      - name: Verify all disposable program containers cleaned
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^lab-code-'; then
            docker ps -a --format '{{.Names}}' | grep '^lab-code-'
            exit 1
          fi
