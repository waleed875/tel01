name: Engineering AI checks

on:
  pull_request:
    paths:
      - 'mathematics-and-physics/**'
      - '.github/workflows/engineering-ai-tests.yml'
  push:
    branches:
      - feature/from-scratch-engineering-ai
    paths:
      - 'mathematics-and-physics/**'
      - '.github/workflows/engineering-ai-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: engineering_tutor_test
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: local_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d engineering_tutor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mathematics-and-physics
    env:
      TEST_DATABASE_URL: postgresql://tutor:local_test_password_only@localhost:5432/engineering_tutor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mathematics-and-physics/requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q webapp.py storage.py tutor.py engine knowledge.py questions.py tests
      - name: Unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
